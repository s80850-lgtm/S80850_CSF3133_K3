
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3 - Contact Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        /* Header Section */
        #header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 25px;
        }

        #header h1 {
            margin: 0;
        }

        #header span {
            color: #f1c40f;
            font-size: 16px;
        }

        /* Content Section */
        #content {
            width: 80%;
            max-width: 650px;
            background-color: white;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="range"] {
            padding: 0;
        }

        input[type="submit"] {
            background-color: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }

        input[type="submit"]:hover {
            background-color: #34495e;
        }

        /* Calculator Section */
        #calculator {
            background-color: #ecf0f1;
            padding: 20px;
            margin-top: 30px;
            border-radius: 8px;
        }

        #calculator input {
            width: 45%;
        }

        #calculator output {
            font-size: 24px;
            font-weight: bold;
            color: green;
        }

        /* Footer Section */
        #footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

    </style>
</head>

<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Contact Us</h1>
        <span>We are happy to hear from you!</span>
    </div>


    <!-- Content Section -->
    <div id="content">

        <h2>Contact Form</h2>

        <form action="#" method="post">

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email address"
                       required>
            </div>

            <div class="form-group">
                <label for="date">Preferred Contact Date:</label>
                <input type="date"
                       id="date"
                       name="date"
                       required>
            </div>

            <div class="form-group">
                <label for="satisfaction">
                    Satisfaction Level:
                    <span id="level">5</span>/10
                </label>

                <input type="range"
                       id="satisfaction"
                       name="satisfaction"
                       min="0"
                       max="10"
                       value="5"
                       oninput="level.textContent = this.value">
            </div>

            <div class="form-group">
                <label for="message">Your Message:</label>
                <textarea id="message"
                          name="message"
                          rows="4"
                          placeholder="Write your message here..."></textarea>
            </div>

            <input type="submit" value="Submit">

        </form>


        <!-- Inline Calculator Section -->
        <div id="calculator">

            <h2>Simple Calculator</h2>

            <p>Enter two numbers to calculate their sum.</p>

            <form oninput="result.value =
                (Number(num1.value) + Number(num2.value))">

                <label for="num1">First Number:</label>

                <input type="number"
                       id="num1"
                       name="num1"
                       value="0">

                <br><br>

                <label for="num2">Second Number:</label>

                <input type="number"
                       id="num2"
                       name="num2"
                       value="0">

                <br><br>

                <span>Total:</span>

                <output name="result" for="num1 num2">0</output>

            </form>

        </div>

    </div>


    <!-- Footer Section -->
    <div id="footer">

        <p>Contact Us: example@gmail.com</p>

        <p>Phone: 012-3456789</p>

        <p>
            &copy; 2026 Contact Us Website.
            All Rights Reserved.
        </p>

    </div>

</body>
</html>
