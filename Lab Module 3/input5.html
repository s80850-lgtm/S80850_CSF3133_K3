
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Input Types</title>
</head>

<body>

    <h1>HTML5 Input Types</h1>

    <form action="">

        Pilih warna kegemaran anda:
        <input type="color" name="warnapilihan">
        <br><br>

        Carian:
        <input type="search" name="carian">
        <br><br>

        Tarikh:
        <input type="date" name="tarikh">
        <br><br>

        Masa:
        <input type="time" name="masa">
        <br><br>

        Bulan dan Tahun:
        <input type="month" name="bulandantahun">
        <br><br>

        Laman Web:
        <input type="url" name="lamanweb">
        <br><br>

        Minggu:
        <input type="week" name="minggu">
        <br><br>

        Email:
        <input type="email" name="useremail">
        <br><br>

        <input type="submit" value="Hantar">

    </form>

</body>
</html>
