<!DOCTYPE html>

<html>

<body>

    <h2>What Can JavaScript Do?</h2>

    <p>JavaScript can change HTML attribute values.</p>

    <p>In this case, JavaScript changes the value of
    the 'src' (source) attribute of an image.</p>

    <!-- Button to turn the light ON -->
    <button onclick='document.getElementById("myImage").src="pic_bulbon.jpg"'>
        Turn on the light
    </button>

    <!-- Image tag -->
    <img id="myImage" src="pic_bulboff.jpg" style="width:100px">

    <!-- Button to turn the light OFF -->
    <button onclick='document.getElementById("myImage").src="pic_bulboff.jpg"'>
        Turn off the light
    </button>

</body>

</html>
