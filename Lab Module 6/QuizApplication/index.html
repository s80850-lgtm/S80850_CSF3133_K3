<!DOCTYPE html>
<html>
<head>
    <title>Quiz Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Quiz Application</h1>
        <p>Test Your Knowledge!</p>
    </header>

    <main>

        <section id="quiz-section">

            <h2 id="question">Welcome to the Quiz!</h2>

            <p id="timer">Time: 15 seconds</p>

            <div id="options"></div>

            <p id="feedback"></p>

            <button id="submit-btn" onclick="checkAnswer()">
                Start Quiz
            </button>

        </section>

    </main>

    <footer>
        <h3 id="score">Your Score: 0</h3>
    </footer>

    <script src="script.js"></script>

</body>
</html>
